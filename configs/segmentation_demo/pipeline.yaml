- signal: run_started
- when:
    condition: $ctx:phase.due
    body:
    - iterate:
        source: validation_batch
        body:
        - call: validation_move_input
        - call: validation_move_target
        - call: validation_forward
        - call: validation_loss
        - call: metrics
        - signal:
            name: phase_batch_completed
            payload:
              phase: validation
    - signal:
        name: phase_completed
        payload:
          phase: validation
- while:
    condition: $ctx:run.stop
    equals: false
    max_iterations: 100000
    body:
    - call: batch
    - call: move_input
    - call: move_target
    - call: forward
    - call: loss
    - call: dice
    - call: mix
    - call: train_metrics
    - call: optimizer
    - when:
        condition: $ctx:optim.main.did_step
        body:
        - signal: step_completed
    - when:
        condition: $ctx:phase.due
        body:
        - iterate:
            source: validation_batch
            body:
            - call: validation_move_input
            - call: validation_move_target
            - call: validation_forward
            - call: validation_loss
            - call: metrics
            - signal:
                name: phase_batch_completed
                payload:
                  phase: validation
        - signal:
            name: phase_completed
            payload:
              phase: validation
