constants:
  max_steps: 3
  seed: 42
  device: cpu
modules:
  seed:
    params:
      seed: $const:seed
    class: starling_ml.modules.processing.runtime.Seed
  dataset:
    params:
      factory: starling_ml.modules.data.general.SyntheticDataset
      output: data.dataset
      kwargs:
        task: segmentation
        spatial:
        - 8
        - 8
        seed: 42
    class: starling_ml.modules.processing.runtime.ObjectFactory
  batch:
    params:
      dataset: $ctx:data.dataset
      outputs:
        batch.input: input
        batch.target: target
      batch_size: 4
      seed: 42
    class: starling_ml.modules.data.general.BatchSource
  model:
    params:
      factory: starling_ml.modules.models.architectures.Segmenter
      output: model.raw
      kwargs:
        classes: 3
        spatial_dims: 2
    class: starling_ml.modules.processing.runtime.ObjectFactory
  device:
    params:
      model: $ctx:model.raw
      device: $const:device
      output: model.instance
    class: starling_ml.modules.processing.runtime.PrepareModel
  move_input:
    params:
      input: batch.input
      device: $const:device
    class: starling_ml.modules.processing.runtime.MoveToDevice
  move_target:
    params:
      input: batch.target
      device: $const:device
    class: starling_ml.modules.processing.runtime.MoveToDevice
  forward:
    params:
      model: $ctx:model.instance
      input: batch.input
      output: model.output
    class: starling_ml.modules.forward.Forward
  loss:
    params:
      prediction: model.output
      target: batch.target
      output: loss.pointwise
    class: starling_ml.modules.losses.basic.CrossEntropy
  dice:
    params:
      prediction: model.output
      target: batch.target
      output: loss.dice
      mode: multiclass
      empty_target: false_positive
    class: starling_ml.modules.losses.overlap.DiceLoss
  mix:
    params:
      terms:
      - loss: loss.pointwise
      - loss: loss.dice
    class: starling_ml.modules.losses.combine.LossMixer
  optimizer:
    params:
      model: $ctx:model.instance
      lr: 0.001
    class: starling_ml.modules.optimization.OptimizationManager
  run:
    params:
      max_steps: $const:max_steps
      defer_finish: true
    class: starling_ml.modules.control.run.RunManager
  phase:
    params:
      validate_at_end: true
      validate_every: 2
      validate_at_start: true
    class: starling_ml.modules.control.phase.PhaseManager
  train_metrics:
    class: starling_ml.modules.metrics.segmentation.SegmentationMetrics
    params:
      num_classes: 3
      prediction: model.output
      target: batch.target
      mode: multiclass
      prefix: metrics.train
      phase: train
      reset_on: phase_started
      finalize_on: phase_ended
  validation_batch:
    class: starling_ml.modules.data.general.BatchSource
    params:
      dataset: $ctx:data.dataset
      outputs:
        validation.input: input
        validation.target: target
      batch_size: 4
      cycle: false
      shuffle: false
      reset_on:
      - validation_start
  validation_move_input:
    class: starling_ml.modules.processing.runtime.MoveToDevice
    params:
      input: validation.input
      device: $const:device
  validation_move_target:
    class: starling_ml.modules.processing.runtime.MoveToDevice
    params:
      input: validation.target
      device: $const:device
  validation_forward:
    class: starling_ml.modules.forward.Forward
    params:
      model: $ctx:model.instance
      input: validation.input
      output: validation.output
      training: false
  validation_loss:
    class: starling_ml.modules.losses.overlap.DiceLoss
    params:
      prediction: validation.output
      target: validation.target
      output: validation.loss
      mode: multiclass
      empty_target: false_positive
  metrics:
    class: starling_ml.modules.metrics.segmentation.SegmentationMetrics
    params:
      num_classes: 3
      prediction: validation.output
      target: validation.target
      mode: multiclass
contracts:
  seed:
    creates: []
    reads: []
    mutates: []
    updates: []
  dataset:
    creates:
    - data.dataset
    reads: []
    mutates: []
    updates: []
  batch:
    creates:
    - batch.input
    - batch.target
    reads:
    - data.dataset
    mutates: []
    updates: []
  model:
    creates:
    - model.raw
    reads: []
    mutates: []
    updates: []
  device:
    creates:
    - model.instance
    reads:
    - model.raw
    mutates:
    - model.raw
    updates: []
  move_input:
    creates: []
    reads:
    - batch.input
    mutates: []
    updates:
    - batch.input
  move_target:
    creates: []
    reads:
    - batch.target
    mutates: []
    updates:
    - batch.target
  forward:
    creates:
    - model.output
    reads:
    - model.instance
    - batch.input
    mutates:
    - model.instance
    updates: []
  loss:
    creates:
    - loss.pointwise
    reads:
    - model.output
    - batch.target
    mutates: []
    updates: []
  dice:
    creates:
    - loss.dice
    reads:
    - model.output
    - batch.target
    mutates: []
    updates: []
  mix:
    creates:
    - train.loss
    reads:
    - loss.pointwise
    - loss.dice
    mutates: []
    updates: []
  optimizer:
    creates:
    - optim.main.optimizer
    - optim.main.did_step
    - optim.main.step
    - optim.main.micro_step
    - optim.main.grad_norm
    - optim.main.skipped
    reads:
    - model.instance
    - train.loss
    mutates:
    - model.instance
    updates: []
  run:
    creates:
    - run.step
    - run.status
    - run.finish_requested
    - run.stop
    reads: []
    mutates: []
    updates: []
  phase:
    creates:
    - phase.name
    - phase.index
    - phase.step
    - phase.cycle
    - phase.due
    - run.phase
    - run.validation_index
    - run.validation_due
    reads:
    - run.step
    - run.finish_requested
    - run.stop
    mutates: []
    updates: []
  train_metrics:
    creates:
    - metrics.train.precision
    - metrics.train.precision_mean
    - metrics.train.recall
    - metrics.train.recall_mean
    - metrics.train.f1
    - metrics.train.f1_mean
    - metrics.train.dice
    - metrics.train.dice_mean
    - metrics.train.iou
    - metrics.train.iou_mean
    - metrics.train.accuracy
    - metrics.train.accuracy_mean
    reads:
    - model.output
    - batch.target
    mutates: []
    updates: []
  validation_batch:
    creates:
    - validation.input
    - validation.target
    reads:
    - data.dataset
    mutates: []
    updates: []
  validation_move_input:
    creates: []
    reads:
    - validation.input
    mutates: []
    updates:
    - validation.input
  validation_move_target:
    creates: []
    reads:
    - validation.target
    mutates: []
    updates:
    - validation.target
  validation_forward:
    creates:
    - validation.output
    reads:
    - model.instance
    - validation.input
    mutates:
    - model.instance
    updates: []
  validation_loss:
    creates:
    - validation.loss
    reads:
    - validation.output
    - validation.target
    mutates: []
    updates: []
  metrics:
    creates:
    - metrics.validation.precision
    - metrics.validation.precision_mean
    - metrics.validation.recall
    - metrics.validation.recall_mean
    - metrics.validation.f1
    - metrics.validation.f1_mean
    - metrics.validation.dice
    - metrics.validation.dice_mean
    - metrics.validation.iou
    - metrics.validation.iou_mean
    - metrics.validation.accuracy
    - metrics.validation.accuracy_mean
    reads:
    - validation.output
    - validation.target
    mutates: []
    updates: []
pipeline:
- signal: run_started
- when:
    condition: $ctx:phase.due
    body:
    - iterate:
        source: validation_batch
        body:
        - call: validation_move_input
        - call: validation_move_target
        - call: validation_forward
        - call: validation_loss
        - call: metrics
        - signal:
            name: phase_batch_completed
            payload:
              phase: validation
    - signal:
        name: phase_completed
        payload:
          phase: validation
- while:
    condition: $ctx:run.stop
    equals: false
    max_iterations: 100000
    body:
    - call: batch
    - call: move_input
    - call: move_target
    - call: forward
    - call: loss
    - call: dice
    - call: mix
    - call: train_metrics
    - call: optimizer
    - when:
        condition: $ctx:optim.main.did_step
        body:
        - signal: step_completed
    - when:
        condition: $ctx:phase.due
        body:
        - iterate:
            source: validation_batch
            body:
            - call: validation_move_input
            - call: validation_move_target
            - call: validation_forward
            - call: validation_loss
            - call: metrics
            - signal:
                name: phase_batch_completed
                payload:
                  phase: validation
        - signal:
            name: phase_completed
            payload:
              phase: validation
